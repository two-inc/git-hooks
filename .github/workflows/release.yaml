name: Release

# Bumps the CalVer version, tags it and pushes to main. Consumers pin the tag
# in .pre-commit-config.yaml. Uses the org App, which can bypass main's PR rule.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to set (e.g. 26.10.06), leave empty for today's date"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ vars.RUNNER_STANDARD }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TWO_INC_APP_CLIENT_ID }}
          private-key: ${{ secrets.TWO_INC_APP_PRIVATE_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: |
          echo "user-id=$(curl -sS -H "Authorization: token $GH_TOKEN" "https://api.github.com/users/${{ steps.app-token.outputs.app-slug }}%5Bbot%5D" | jq -r .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Bump version, tag and push
        run: uvx bumpver update ${VERSION:+--set-version "$VERSION"}
        env:
          VERSION: ${{ inputs.version }}

      - name: Create GitHub release
        run: gh release create "$(git describe --tags --exact-match)" --generate-notes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
